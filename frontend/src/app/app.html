<!-- Navbar — hidden on all /admin routes -->
<ng-container *ngIf="!isAdminRoute">

  <nav class="navbar" [class.scrolled]="isScrolled">
    <a class="logo" routerLink="/">Om's <span>Portfolio</span></a>

    <div class="nav-right">
      <div class="nav-links">
        <a routerLink="/"        routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
        <a routerLink="/poems"   routerLinkActive="active">Poems</a>
        <a routerLink="/gallery" routerLinkActive="active">Gallery</a>
        <a routerLink="/about"   routerLinkActive="active">About</a>
      </div>

      <button class="theme-toggle" (click)="toggleTheme()">
        <span *ngIf="!darkMode">🌙</span>
        <span *ngIf="darkMode">☀️</span>
      </button>

      <button class="hamburger" [class.open]="menuOpen" (click)="toggleMenu()" aria-label="Toggle menu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
    </div>
  </nav>

  <!-- Mobile menu drawer -->
  <div class="mobile-menu" [class.open]="menuOpen" (click)="onOverlayClick($event)">
    <div class="mobile-menu-panel">
      <a routerLink="/"        routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" (click)="closeMenu()">Home</a>
      <a routerLink="/poems"   routerLinkActive="active" (click)="closeMenu()">Poems</a>
      <a routerLink="/gallery" routerLinkActive="active" (click)="closeMenu()">Gallery</a>
      <a routerLink="/about"   routerLinkActive="active" (click)="closeMenu()">About</a>

      <button class="theme-toggle mobile-theme-toggle" (click)="toggleTheme()">
        <span *ngIf="!darkMode">🌙 Light</span>
        <span *ngIf="darkMode">☀️ Dark</span>
      </button>
    </div>
  </div>

</ng-container>

<router-outlet></router-outlet>

<!-- Footer — hidden on admin routes -->
<footer class="site-footer" *ngIf="!isAdminRoute">
  <div class="footer-inner">

    <div class="footer-brand">
      <span class="footer-logo">Om's <span>Portfolio</span></span>
      <p>Building with code. Writing with feeling.</p>
    </div>

    <nav class="footer-links">
      <a routerLink="/">Home</a>
      <a routerLink="/poems">Poems</a>
