<section class="hero-intro">
  <h1 class="reveal">
    Capturing the <span>Essence</span> of Moments
  </h1>
  <p class="reveal">
    Through the lens of creativity and structured expression.
    Photography and poetry intersect here.
  </p>
</section>

<section class="hero-gallery">
  <div class="masonry">
    <div class="masonry-image reveal-scale" *ngFor="let img of heroImages; let i = index">
      <img [src]="img" loading="lazy" />
    </div>
  </div>
</section>

<section class="preview-section">
  <h2 class="reveal">Latest Poems</h2>

  <div class="poem-card reveal-scale" *ngFor="let poem of poems">
    <h3>{{ poem.title }}</h3>
    <p>{{ poem.content }}</p>
  </div>

  <button routerLink="/poems" class="reveal">View More Poems</button>
</section>
